appId: com.dwatson251.apexdraft
productName: Apex Draft
directories: { output: release, buildResources: build }
files: [out/**/*, package.json]
win: { target: [nsis, zip] }
nsis: { oneClick: false, allowToChangeInstallationDirectory: true }
linux:
  target: [AppImage, tar.gz]
  category: Game
  # `Steam Deck` build: the x86_64 AppImage runs on SteamOS (Desktop mode, or add it to Steam as a non-Steam game)
  desktop: { Name: Apex Draft, Comment: "Draw the racing line, then watch the car follow it", Categories: "Game;RacingGame;" }
appImage: { artifactName: "ApexDraft-${version}-steamdeck-x86_64.${ext}" }
mac: { target: [dmg, zip], category: public.app-category.racing-games }
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
publish: null
